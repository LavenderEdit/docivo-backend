version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis

  worker:
    build: .
    restart: unless-stopped
    volumes:
      - .:/code
    env_file:
      - .env
    command: celery -A app.worker.celery_app worker --loglevel=info
    depends_on:
      - redis
      - api

volumes:
  redis_data: